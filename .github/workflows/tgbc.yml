name: Update Tough Guy Book Club Book

on:
  schedule:
    - cron: '0 8 4 * *' # Runs monthly on the 4th day
  workflow_dispatch:      # Allows you to manually trigger it anytime from the GitHub Actions tab

permissions:
  contents: write         # Required so the action can commit changes back to your repo

jobs:
  update-book:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run update script
        run: node tgbc.js

      - name: Commit and push changes if updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]"@users.noreply.github.com
          git add data/current-book.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update current book of the month [skip ci]" && git push)